# ──────────────────────────────────────────────────────────────
# Preview Environment — Neon Database Branching
# ──────────────────────────────────────────────────────────────
# Creates an isolated Neon database branch for every pull request,
# applies Drizzle migrations, and tears down on close.
#
# Required secrets:
#   NEON_API_KEY         — Neon API key
#   NEON_PROJECT_ID      — Neon project ID (from Terraform output)
#   VERCEL_TOKEN         — Vercel API token
#   VERCEL_ORG_ID        — Vercel team/org ID
#   VERCEL_PROJECT_ID    — Vercel project ID

name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_BRANCH_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  # ── Create or update the preview database branch ──────────
  setup-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db_url: ${{ steps.branch.outputs.db_url }}
      db_url_direct: ${{ steps.branch.outputs.db_url_with_pooler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or get Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          username: neondb_owner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          DATABASE_URL_DIRECT: ${{ steps.branch.outputs.db_url_with_pooler }}

      - name: Comment on PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🔄 Preview Environment Ready',
              '',
              `**Neon branch:** \`${{ env.NEON_BRANCH_NAME }}\``,
              '',
              'Database migrations have been applied.',
              'The Vercel preview deployment will use this branch.',
            ].join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body?.includes('Preview Environment Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Tear down the preview database branch on PR close ─────
  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### 🧹 Preview Environment Cleaned Up\n\nNeon branch `${{ env.NEON_BRANCH_NAME }}` has been deleted.',
            });
